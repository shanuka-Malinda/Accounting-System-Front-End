<div class="container mx-auto p-6 bg-gray-50 min-h-screen">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gray-800">Customer Account</h1>
    <button (click)="openModal()" class="px-4 py-2.5 bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors duration-200">
      Add Accounts
    </button>
  </div>

  <!-- Modal -->
  <div *ngIf="isModalOpen" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center">
    <div class="relative mx-auto p-5 border w-full max-w-lg shadow-lg rounded-md bg-white">
      <div class="flex justify-between items-center pb-3">
        <h3 class="text-2xl font-bold text-gray-800">Add New Account</h3>
        <button (click)="closeModal()" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
        </button>
      </div>
      <form [formGroup]="addAccountForm" (ngSubmit)="onSubmit()">
      <div class="space-y-4">
        
        <!-- Account Name -->
        <div>
          <label for="acc_name" class="block text-sm font-medium text-gray-700 mb-1">Account Name</label>
          <input
            type="text"
            name="acc_name"
            id="acc_name"
            formControlName="acc_name"
            placeholder="Enter account name"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors duration-200"
          />
            <div *ngIf="addAccountForm.controls['acc_name'].invalid && (addAccountForm.controls['acc_name'].dirty || addAccountForm.controls['acc_name'].touched)" class="text-red-500 text-sm mt-1">
                Account name is required.
                </div>
        </div>

        <!-- Account Description -->
        <div>
          <label for="acc_desc" class="block text-sm font-medium text-gray-700 mb-1">Account Description</label>
          <input
            type="text"
            name="acc_desc"
            id="acc_desc"
            formControlName="acc_desc"
            placeholder="Enter account description"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors duration-200"
          />
            <div *ngIf="addAccountForm.controls['acc_desc'].invalid && (addAccountForm.controls['acc_desc'].dirty || addAccountForm.controls['acc_desc'].touched)" class="text-red-500 text-sm mt-1">
                Account description is required.
                </div>
        </div>

 

        <!-- Submit Button -->
        <div class="mt-6">
          <button
            type="submit"
            [disabled]="addAccountForm.invalid"
            class="w-full px-4 py-2.5 bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed"
          >
            Add Account
          </button>
        </div>
      </div>
    </form>
    </div>
  </div>

  <div class="shadow-xl rounded-lg overflow-hidden bg-white">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gradient-to-r from-indigo-600 to-indigo-500 text-white">
          <tr>
            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider">#</th>
            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider">Accout No</th>
            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider">Name</th>
            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider">Description</th>
            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider">Created At</th>
            <th class="px-6 py-4 text-left text-sm font-semibold tracking-wider">Action</th>
          </tr>
        </thead>
         
        <tbody class="bg-white divide-y divide-gray-200">
          <ng-container *ngFor="let acc of accounts; let i = index">
            <tr class="hover:bg-gray-50 transition-colors duration-200">
              <td class="px-6 py-4 text-gray-700">{{ i + 1 }}</td>
              <td class="px-6 py-4 text-gray-700">{{ acc.accNo }}</td>
              <td class="px-6 py-4 text-gray-700">{{ acc.name }}</td>
              <td class="px-6 py-4">
                {{ acc.description }}
              </td>
              <td class="px-6 py-4 text-gray-700">{{ acc.createdAt | date:'medium' }}</td>
              <td class="px-6 py-4">
                 <button class="text-indigo-600 hover:text-indigo-900">Edit</button>
                 <button class="text-red-600 hover:text-red-900 ml-2">Disable</button>
              </td>
            </tr>
            
          </ng-container>
        </tbody>
      </table>
    </div>
  </div>
</div>
